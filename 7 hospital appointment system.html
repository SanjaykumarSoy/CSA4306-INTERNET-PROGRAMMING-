<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    
</head>

<body>

<header>
    <h1> MedCare Hospital</h1>
</header>

<div class="appointment-container">

<form class="appointment-form">

<h2>Book an Appointment</h2>

<label>Patient Name</label>
<input type="text" placeholder="Enter Patient Name" required>

<label>Age</label>
<input type="number" placeholder="Enter Age" required>

<label>Gender</label>
<select required>
    <option>Select Gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select>
<hr>
<label>Select Doctor</label>
<select required>
    <option>Select Doctor</option>
    <option>Dr. Kumar - Cardiologist</option>
    <option>Dr. Priya - Dermatologist</option>
    <option>Dr. Raj - Orthopedic</option>
    <option>Dr. Anitha - Pediatrician</option>
</select>

<label>Department</label>
<select required>
    <option>Cardiology</option>
    <option>Dermatology</option>
    <option>Orthopedics</option>
    <option>Pediatrics</option>
</select>

<label>Appointment Date</label>
<input type="date" required>

<label>Appointment Time</label>
<input type="time" required>

<br>

<input type="submit" value="Book Appointment">

</form>

</div>
</body>
</html>
