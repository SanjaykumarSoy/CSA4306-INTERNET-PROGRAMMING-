<div class="recipe">

    <h1>🍝 Pasta Recipe</h1>

    <h2>Ingredients</h2>

    <ul>
        <li>200g Pasta</li>
        <li>2 Tomatoes</li>
        <li>1 Onion</li>
        <li>2 Garlic Cloves</li>
        <li>Salt and Pepper</li>
    </ul>

    <h2>Instructions</h2>

    <ol>
        <li>Boil the pasta.</li>
        <li>Chop the vegetables.</li>
        <li>Cook onion, garlic and tomatoes.</li>
        <li>Add the boiled pasta.</li>
        <li>Add salt and pepper.</li>
        <li>Cook for 5 minutes and serve.</li>
    </ol>

    <button>❤️ Save Favorite</button>
