<!DOCTYPE html>
<html>
<head>
    <title>Income Tax Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1> Income Tax Calculator</h1>
</header>

<div class="container">

    <h2>Enter Your Financial Details</h2>

    <label>Annual Salary</label>
    <input type="number" placeholder="Enter annual salary">

    <label>Bonus</label>
    <input type="number" placeholder="Enter bonus">

    <label>Other Taxable Income</label>
    <input type="number" placeholder="Enter other income">

    <label>Deductions</label>
    <input type="number" placeholder="Enter deductions">

    <label>Insurance / Retirement Contributions</label>
    <input type="number" placeholder="Enter amount">

    <button>Calculate Tax</button>

    <div class="result">

        <h2>Tax Summary</h2>

        <p>Total Income: ₹6,00,000</p>
        <p>Total Deductions: ₹50,000</p>
        <p>Taxable Income: ₹5,50,000</p>
        <p>Tax Liability: ₹25,000</p>
        <p>Net Income: ₹5,75,000</p>

    </div>

</div>

<footer>
    <p>© 2026 Income Tax Calculator</p>
</footer>

</body>
</html>
